# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that runs it (yggdrasil's
# docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images (pinned by version and
# digest, which Renovate keeps up to date), commands and globs. The commands are scripts under ci/ that run from the
# repository's root, so you can run them on your own machine too. The repository is python-dotnet-tools, a Python
# package (pyproject.toml, Python 3.11+) of CLI helpers for .NET projects: nothing is deployed or released from it.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe python-dotnet-tools <this repository's checkout>

checks:
  lint: # ruff check, with the rules pyproject.toml selects, pinned in ci/lint.sh
    image: python:3.13.17-bookworm@sha256:a3799099b64fd333f262768c7a64733f6e4edb7bc569813710a100214bdcf278
    run: ci/lint.sh

  build: # the sdist and wheel (python -m build), then the end-to-end pytest suites, which drive the real dotnet, git and
    # reportgenerator: hence the .NET SDK image (the templates target net10.0), with Python added by ci/build.sh
    image: mcr.microsoft.com/dotnet/sdk:10.0.404@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
    run: ci/build.sh
