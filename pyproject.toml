[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dotnet-tools"
version = "0.1.0"
description = "CLI helpers to build, clean, test, and bump versions for .NET projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { file = "LICENSE" }
keywords = ["dotnet", "cli", "build", "test", "coverage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# No runtime deps; these scripts call external tools (dotnet, reportgenerator) which must be installed separately.
dependencies = []

[project.urls]
Homepage = "https://github.com/your/repo"

[project.scripts]
python-dotnet-tools = "cli:main"
python-dotnet-build = "commands.build:main"
python-dotnet-clean = "commands.clean:main"
python-dotnet-test = "commands.test:main"
python-dotnet-bump = "commands.bump:main"
python-dotnet-tag = "commands.tag:main"
python-dotnet-init-lib = "commands.init_lib:main"
python-dotnet-init-min = "commands.init_min:main"
python-dotnet-init-proj = "commands.init_proj:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"commands._data" = [
  "templates/*",
  "parameters/*"
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]

[tool.ruff.lint]
# ruff's long-standing default rules, pyflakes (F) and pycodestyle's errors (E4, E7, E9), named so that a newer ruff
# with a wider default set does not change what ci/lint.sh checks.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The sources, not an installed copy, so a checkout is tested as it is.
pythonpath = ["src"]
markers = [
  "e2e: drives the real dotnet, reportgenerator and git (deselect with -m \"not e2e\")",
]

[tool.coverage.run]
branch = true
source = ["src"]
# Not a package anything imports: pyproject maps the sources under src/ to top-level names.
omit = ["src/__init__.py"]

[tool.coverage.report]
# The floor ci/build.sh enforces. Raise it when coverage rises; never lower it.
fail_under = 95
show_missing = true
skip_covered = true
